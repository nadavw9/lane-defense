name: iOS App Review video (simulator)
# App Review (Guideline 2.1, 2026-11-05) asked for a screen recording of the typical flow, starting
# with the app launch. The owner had no iPhone at hand, so this records the real app on the iOS
# Simulator: a Debug simulator build whose web bundle is made with VITE_DEMO_AUTOPILOT=true, so the
# game plays itself through real input (src/input/demoAutopilot.js; store builds never contain it).
# The raw recording + a screenshot every 20 s are kept as the artifact `review-video`; compress it
# and attach it with TrafficBomb-owner/ios-signing/tools (appStoreReviewAttachments).
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long the autopilot plays (the recording runs ~15 s longer)'
        default: '170'
        required: true
      att:
        description: 'yes = the build shows the real App Tracking Transparency prompt and the run taps Allow (App Review 13 Nov 2026 asked to see it)'
        default: 'yes'
        required: true

permissions:
  contents: read

jobs:
  video:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VITE_DEMO_AUTOPILOT: 'true'
      VITE_DEMO_SECONDS: ${{ github.event.inputs.seconds }}
      VITE_DEMO_ATT: ${{ github.event.inputs.att == 'yes' && 'true' || 'false' }}
      VITE_ADS_MODE: test
      VITE_APP_VERSION: review-video
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Build for the simulator (Debug, unsigned)
        run: |
          GAD_ID="${{ vars.IOS_ADMOB_APP_ID || 'ca-app-pub-3940256099942544~1458002511' }}"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            GAD_APPLICATION_ID="$GAD_ID" CODE_SIGNING_ALLOWED=NO build | tail -30
          test "${PIPESTATUS[0]}" -eq 0
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/App.app)
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "::notice title=App::$(du -sh "$APP" | cut -f1)"

      # Tapping the ATT system alert: macOS accessibility (osascript on the Simulator window) first,
      # idb (taps through CoreSimulator, needs no accessibility permission) as the fallback.
      - name: Tools to tap the tracking prompt
        if: env.VITE_DEMO_ATT == 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          brew tap facebook/fb >/dev/null && brew install facebook/fb/idb-companion >/dev/null || echo "idb-companion not installed"
          pip3 install --quiet --break-system-packages fb-idb || pip3 install --quiet fb-idb || echo "fb-idb not installed"
          command -v idb && echo "::notice title=idb::ready" || true

      - name: Boot an iPhone simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          best=None
          for rt,devs in d.items():
            if 'iOS' not in rt: continue
            for x in devs:
              n=x['name']
              if not n.startswith('iPhone'): continue
              # Run 3: the runner has no GPU for the simulator, so every pixel costs CPU (a 1320x2868
              # Pro Max starved the runner). Take the SMALLEST screen; App Review needs any iPhone.
              small=('SE' in n)*4 + ('16e' in n)*3 - ('Pro' in n)*2 - ('Max' in n)*2 - ('Plus' in n)*2 - ('Air' in n)*2
              score=(small, rt)
              if best is None or score>best[0]: best=(score,x['udid'],n,rt)
          print(best[1]); print(best[2], best[3], file=sys.stderr)")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          open -a Simulator || true
          sleep 10
          xcrun simctl install "$UDID" "$APP"

      # Runs 1 and 2 (2026-11-05) hung somewhere in this step and their logs were lost (a run
      # cancelled during the upload keeps no log). So: every simctl call has a HARD time limit
      # (perl alarm; macOS has no `timeout`), every line is time-stamped into out/trace.txt, the
      # step never trusts a background job to stop by itself, and the job always ENDS on its own.
      - name: Record the app (launch, then the autopilot plays)
        timeout-minutes: 15
        run: |
          set +e
          mkdir -p out
          log() { echo "[$(date +%H:%M:%S)] $*" | tee -a out/trace.txt; }
          lim() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          log "UDID=$UDID  state: $(xcrun simctl list devices | grep "$UDID")"
          # recordVideo finalizes the mp4 only on SIGINT; a background job of a non-interactive
          # shell starts with SIGINT ignored, so perl restores the default before exec.
          perl -e '$SIG{INT}="DEFAULT"; exec @ARGV' xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/review-video.mp4 > out/rec.log 2>&1 &
          REC=$!
          for i in $(seq 1 30); do grep -qi "recording started" out/rec.log && break; kill -0 $REC 2>/dev/null || break; sleep 1; done
          log "recorder pid=$REC alive=$(kill -0 $REC 2>/dev/null && echo yes || echo no) after ${i}s: $(tr '\n' ' ' < out/rec.log)"
          log "launch ..."
          lim 90 xcrun simctl launch "$UDID" com.nadavw.trafficbomb > out/launch.log 2>&1
          log "launch rc=$? $(tr '\n' ' ' < out/launch.log)"
          if [ "$VITE_DEMO_ATT" = "true" ]; then
            # The app asks once it is active (src/ads/tracking.js). Look for the alert's Allow button
            # for up to ~2 minutes; stop at the first successful tap. scripts/ci/att-tap.sh does the work.
            ATT=none
            for i in $(seq 1 24); do
              sleep 5
              r=$(bash scripts/ci/att-tap.sh "$UDID" 2>&1)
              log "ATT try $i: $(echo "$r" | tr '\n' ' ' | head -c 300)"
              case "$r" in *CLICKED*) ATT=$(echo "$r" | grep -o 'CLICKED-[a-z]*'); break;; esac
            done
            log "ATT result: $ATT"
            echo "::notice title=Tracking prompt::$ATT"
            echo "$ATT" > out/att-result.txt
          fi
          # Wall clock only (run 3: screenshots took 30 s+ each and starved the game). The autopilot
          # plays VITE_DEMO_SECONDS of real time from its start; 25 s more covers launch + the title.
          END=$(( $(date +%s) + ${VITE_DEMO_SECONDS:-170} + 25 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 15
            log "video=$(stat -f %z out/review-video.mp4 2>/dev/null || echo none) load=$(sysctl -n vm.loadavg)"
          done
          log "stop recorder (SIGINT)"
          kill -INT $REC
          for i in $(seq 1 30); do kill -0 $REC 2>/dev/null || break; sleep 1; done
          if kill -0 $REC 2>/dev/null; then log "recorder ignored SIGINT for 30 s -> TERM"; kill -TERM $REC; sleep 3; kill -9 $REC 2>/dev/null; fi
          log "recorder log: $(tr '\n' ' ' < out/rec.log)"
          # Free the runner for the upload (run 3: a 323 MB upload crawled beside a running simulator).
          lim 90 xcrun simctl shutdown "$UDID"
          log "simulator shutdown rc=$?"
          ls -la out | tee -a out/trace.txt
          test -s out/review-video.mp4

      - name: Make sure no recorder is still writing
        if: always()
        timeout-minutes: 1
        run: |
          pkill -INT -f recordVideo || true
          sleep 5
          pkill -9 -f recordVideo || true
          cat out/trace.txt 2>/dev/null | tail -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 20
        with:
          name: review-video
          path: out/
          compression-level: 0
          retention-days: 14
