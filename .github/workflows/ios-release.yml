name: iOS build / TestFlight

# The iPhone build of Traffic Bomb, on GitHub's macOS runners (no Mac needed; free for this public repo).
#
# Two modes:
#   * Unsigned compile check: every push that touches ios/ or this file, and any manual run before
#     the Apple keys exist. Proves the project, the plugins (Swift packages) and the web bundle build.
#   * Signed TestFlight upload: a manual run with upload=testflight once these are set
#     (Settings > Secrets and variables > Actions):
#       variable APPLE_TEAM_ID          Membership details > Team ID (developer.apple.com/account)
#       variable IOS_PROFILE_NAME       name of the App Store provisioning profile
#       secret   IOS_DIST_P12_BASE64    Apple Distribution certificate + private key (.p12), base64
#       secret   IOS_DIST_P12_PASSWORD  its password
#       secret   IOS_PROFILE_BASE64     the App Store profile (.mobileprovision), base64
#       secret   ASC_KEY_ID             App Store Connect > Users and Access > Integrations > API key
#       secret   ASC_ISSUER_ID          shown above the key list
#       secret   ASC_KEY_P8_BASE64      the downloaded AuthKey_XXXX.p8, base64-encoded (upload only)
#     Signing is MANUAL: the certificate and profile are created once through the App Store Connect
#     API (owner script 4-apple-signing-to-github.cmd on the owner's PC) and imported into a
#     throw-away keychain on the runner. Cloud signing (-allowProvisioningUpdates creating the
#     certificate) was tried first and fails with "Cloud signing permission error" even with an
#     Admin-role key, and automatic signing of the archive wants a development profile, which
#     needs a registered device. The archive is built unsigned; -exportArchive signs it.
#     Optional variables for live iPhone ads: IOS_ADMOB_APP_ID, VITE_IOS_REWARDED_AD_ID,
#     VITE_IOS_INTERSTITIAL_AD_ID (until both units are set the app stays on test ads; see AdManager).
on:
  workflow_dispatch:
    inputs:
      ads:
        description: 'Ad mode baked into the build (test or live)'
        default: test
        required: true
      upload:
        description: 'none = compile check only, testflight = signed upload to App Store Connect'
        default: none
        required: true
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    env:
      VITE_ADS_MODE: ${{ github.event.inputs.ads || 'test' }}
      VITE_APP_VERSION: 1.1.${{ github.run_number }}
      VITE_IOS_REWARDED_AD_ID: ${{ vars.VITE_IOS_REWARDED_AD_ID }}
      VITE_IOS_INTERSTITIAL_AD_ID: ${{ vars.VITE_IOS_INTERSTITIAL_AD_ID }}
      UPLOAD: ${{ github.event.inputs.upload || 'none' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
          echo "::notice title=SDK::$(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      # Google's sample AdMob app ID unless the real iOS app ID is set (Info.plist reads $(GAD_APPLICATION_ID)).
      - name: Build settings
        run: |
          echo "GAD_ID=${{ vars.IOS_ADMOB_APP_ID || 'ca-app-pub-3940256099942544~1458002511' }}" >> "$GITHUB_ENV"

      - name: Compile check (unsigned)
        if: env.UPLOAD != 'testflight'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            GAD_APPLICATION_ID="$GAD_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          APP=build/Build/Products/Release-iphoneos/App.app
          test -f "$APP/App" || { echo "::error::no App.app binary after the build"; exit 1; }
          echo "::notice title=App built::$(du -sh "$APP" | cut -f1), $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist") build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"), web bundle $(ls "$APP/public" | wc -l | tr -d ' ') files"

      - name: Check Apple keys
        if: env.UPLOAD == 'testflight'
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROF: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          for v in TEAM PROFILE_NAME KID ISS P8 P12 P12PW PROF; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see the header of this workflow)"; exit 1; fi
          done

      # Distribution certificate + App Store profile into a keychain that exists only for this job.
      - name: Install signing certificate and profile
        if: env.UPLOAD == 'testflight'
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROF: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/ci.keychain-db"
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12PW" -A -t cert -f pkcs12 -k "$KC"
          # Apple's intermediate CAs, so the identity has a full chain on the runner.
          for ca in AppleWWDRCAG3 AppleWWDRCAG4; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -t cert -k "$KC" > /dev/null 2>&1 || echo "$ca already present"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC" | tail -3
          echo "$PROF" | base64 --decode > "$RUNNER_TEMP/dist.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/dist.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          echo "::notice title=Profile::$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist") ($UUID), expires $(/usr/libexec/PlistBuddy -c 'Print ExpirationDate' "$RUNNER_TEMP/profile.plist")"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/dist.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Archive and upload to TestFlight
        if: env.UPLOAD == 'testflight'
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$P8" | base64 --decode > "$KEY"
          # The API key is only for the upload to App Store Connect; signing uses the installed certificate.
          AUTH=(-authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            GAD_APPLICATION_ID="$GAD_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          sed -e "s/__TEAM_ID__/$TEAM/" -e "s/__PROFILE_NAME__/$PROFILE_NAME/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          rm -f "$KEY"
          security delete-keychain "$KEYCHAIN" || true
