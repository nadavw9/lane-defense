name: iOS build / TestFlight

# The iPhone build of Traffic Bomb, on GitHub's macOS runners (no Mac needed; free for this public repo).
#
# Two modes:
#   * Unsigned compile check: every push that touches ios/ or this file, and any manual run before
#     the Apple keys exist. Proves the project, the plugins (Swift packages) and the web bundle build.
#   * Signed TestFlight upload: a manual run with upload=testflight once these are set
#     (Settings > Secrets and variables > Actions):
#       variable APPLE_TEAM_ID          Membership details > Team ID (developer.apple.com/account)
#       secret   ASC_KEY_ID             App Store Connect > Users and Access > Integrations > API key
#       secret   ASC_ISSUER_ID          shown above the key list
#       secret   ASC_KEY_P8_BASE64      the downloaded AuthKey_XXXX.p8, base64-encoded
#     The archive signs with "Apple Distribution" so cloud signing makes an App Store profile (a
#     development profile would need a registered device, and the runner has none).
#     The key needs the Admin role: Xcode's automatic signing creates the distribution certificate
#     and the App Store profile in the cloud, so there are no certificates to manage by hand.
#     Optional variables for live iPhone ads: IOS_ADMOB_APP_ID, VITE_IOS_REWARDED_AD_ID,
#     VITE_IOS_INTERSTITIAL_AD_ID (until both units are set the app stays on test ads; see AdManager).
on:
  workflow_dispatch:
    inputs:
      ads:
        description: 'Ad mode baked into the build (test or live)'
        default: test
        required: true
      upload:
        description: 'none = compile check only, testflight = signed upload to App Store Connect'
        default: none
        required: true
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-release.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    env:
      VITE_ADS_MODE: ${{ github.event.inputs.ads || 'test' }}
      VITE_APP_VERSION: 1.1.${{ github.run_number }}
      VITE_IOS_REWARDED_AD_ID: ${{ vars.VITE_IOS_REWARDED_AD_ID }}
      VITE_IOS_INTERSTITIAL_AD_ID: ${{ vars.VITE_IOS_INTERSTITIAL_AD_ID }}
      UPLOAD: ${{ github.event.inputs.upload || 'none' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
          echo "::notice title=SDK::$(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      # Google's sample AdMob app ID unless the real iOS app ID is set (Info.plist reads $(GAD_APPLICATION_ID)).
      - name: Build settings
        run: |
          echo "GAD_ID=${{ vars.IOS_ADMOB_APP_ID || 'ca-app-pub-3940256099942544~1458002511' }}" >> "$GITHUB_ENV"

      - name: Compile check (unsigned)
        if: env.UPLOAD != 'testflight'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            GAD_APPLICATION_ID="$GAD_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          APP=build/Build/Products/Release-iphoneos/App.app
          test -f "$APP/App" || { echo "::error::no App.app binary after the build"; exit 1; }
          echo "::notice title=App built::$(du -sh "$APP" | cut -f1), $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist") build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"), web bundle $(ls "$APP/public" | wc -l | tr -d ' ') files"

      - name: Check Apple keys
        if: env.UPLOAD == 'testflight'
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for v in TEAM KID ISS P8; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see the header of this workflow)"; exit 1; fi
          done

      - name: Archive and upload to TestFlight
        if: env.UPLOAD == 'testflight'
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$P8" | base64 --decode > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            GAD_APPLICATION_ID="$GAD_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          sed "s/__TEAM_ID__/$TEAM/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          rm -f "$KEY"
