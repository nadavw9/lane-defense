name: Android test APK

# Builds a debug-signed tester APK and attaches it to a public GitHub Release.
# Push to the `android-apk` branch (or run manually). Never touches Pages.
on:
  push:
    branches: [android-apk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_ADS_MODE: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          TAG="apk-test-${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "TrafficBomb-test-${SHA}.apk"
          gh release create "$TAG" "TrafficBomb-test-${SHA}.apk" \
            --title "Traffic Bomb test build ${SHA}" \
            --notes "Debug-signed tester APK (test ads). Not for the Play Store." \
            --prerelease --target "$GITHUB_SHA"
