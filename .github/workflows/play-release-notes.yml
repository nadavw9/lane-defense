name: Play release notes

# Attaches play/whatsnew/whatsnew-<lang> to a release that is already on a Play track, without a
# new build. Run after android-release.yml when the notes were not in the repo at build time, or
# to correct them. The newest release on the track is used unless versionCode is given.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track (internal, alpha, beta, production)
        default: internal
        required: true
      versionCode:
        description: Version code of the release to annotate (empty = newest on the track)
        default: ''
        required: false

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the notes onto the release
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ github.event.inputs.track }}
          VERSION_CODE: ${{ github.event.inputs.versionCode }}
        run: node scripts/play-release-notes.mjs
